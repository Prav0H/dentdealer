<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dent Dealer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dent Dealer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>var API_URL = "https://script.google.com/macros/s/AKfycbylW4cLHjeFHA0lyws0izaJTwxmaKQ2k3tNbZoF7-PtzEoHTxPrfKWzGEhNrFB0DpDV/exec";
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;
  --pri:#3b6fd8;--pri-soft:#e3ecfb;--ok:#2f9e6b;--ok-soft:#ddf3e8;--warn:#c07a12;--warn-soft:#fdf0d9;
  --bad:#c94141;--bad-soft:#fbe3e3;--vio-soft:#ece6fb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.hrow{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px}
.who{color:var(--mute);font-size:13px}
.sp{flex:1}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.month button{border:0;background:none;padding:6px 10px;font-size:18px;cursor:pointer}
.month span{min-width:118px;text-align:center;font-weight:600}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:10px 0 0;font-size:13px;color:var(--mute)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}
.chk input{width:20px;height:20px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--mute)}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
.bar input{flex:1}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.item .t{display:flex;gap:8px;align-items:baseline}
.item .t b{flex:1}
.item .s{color:var(--mute);font-size:13px;margin-top:2px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri-soft);color:var(--pri)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.vio{background:var(--vio-soft);color:#6a4fc4}.tag.gray{background:#eef0f3;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;border:0;background:none;padding:8px 2px 10px;color:var(--mute);font-size:12px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:600}
.modal{position:fixed;inset:0;z-index:10;background:rgba(15,23,42,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center}
.sheet h2 span{flex:1}
.x{border:0;background:none;font-size:24px;color:var(--mute);cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:240px;overflow:auto}
.sug div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.sug div:last-child{border:0}
.sug small{color:var(--mute)}
.line{display:grid;grid-template-columns:1fr 64px 64px 28px;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:6px}
.line input,.line select{padding:6px;text-align:center}
.line .nm{font-size:13px}.line .nm small{color:var(--mute);display:block}
.line button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;background:var(--pri-soft);border-radius:12px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
.prog{margin:12px 0}
.prog .h{display:flex;justify-content:space-between;font-size:14px}
.prog .h b{font-weight:600}
.track{height:10px;background:#e9edf3;border-radius:6px;overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--pri);border-radius:6px}
.track i.ok{background:var(--ok)}.track i.warn{background:#e0a33a}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px}
.task .b{flex:1;cursor:pointer}
.task.done .b>div:first-child{text-decoration:line-through;color:var(--mute)}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ftabs button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:7px 12px;font-weight:600;cursor:pointer}
.ftabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ftabs button small{font-weight:500;opacity:.8}
.ftabs button.add{border-style:dashed;color:var(--pri)}
.rs{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rs.off{opacity:.5}
.rs-n{min-width:24px;height:24px;border-radius:12px;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.rs-b{flex:1;min-width:0}
.rs-m{display:flex;flex-direction:column;gap:4px}
.sec-t{font-size:13px;color:var(--mute);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:340px;text-align:center;padding:24px}
#login input{text-align:center;font-size:24px;letter-spacing:.3em;margin:16px 0}
.logo{width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;max-width:90vw}
.toast.err{background:var(--bad)}
.load{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:linear-gradient(90deg,transparent,var(--pri),transparent);background-size:50% 100%;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.code{font-family:ui-monospace,Consolas,monospace;letter-spacing:.1em}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.item.saving{opacity:.7}
button.tag{border:0;cursor:pointer;font:inherit;font-size:12px}
.menu{position:fixed;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.15);padding:4px;min-width:150px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button.on{background:var(--pri-soft);color:var(--pri)}
.tw{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 230px)}
table.ot{border-collapse:collapse;width:100%;font-size:13px;min-width:1180px}
.ot th{position:sticky;top:0;z-index:1;background:#f6f7f9;text-align:left;padding:8px 10px;font-weight:600;color:var(--mute);white-space:nowrap;border-bottom:1px solid var(--line)}
.ot td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ot tbody tr{cursor:pointer}.ot tbody tr:hover td{background:var(--pri-soft)}.ot tr.saving td{opacity:.6}
.ot .num{text-align:right;white-space:nowrap}.ot .tag{white-space:nowrap}
body.wide .wrap,body.wide .hrow{max-width:1500px}.ot td:nth-child(4) .cl,.ot td:nth-child(5) .cl{min-width:160px}.ot td:nth-child(3){min-width:150px}
.ot .cl{max-width:230px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.seg{display:flex;background:#e9edf3;border-radius:10px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kanban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -12px;padding-left:12px;padding-right:12px}
.kcol{flex:0 0 86%;max-width:340px;scroll-snap-align:start;background:#eaeef4;border-radius:14px;padding:10px;min-height:200px}
@media(min-width:900px){.kcol{flex:1 1 0;max-width:none}}
.kcol h4{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between;color:var(--mute)}
.kcol.over{outline:2px dashed var(--pri)}
.kcard{background:var(--card);border-radius:12px;padding:10px 10px 8px;margin-bottom:8px;border-left:4px solid #cbd5e1;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kcard.p-high{border-left-color:var(--bad)}.kcard.p-low{border-left-color:#9ec5a8}
.kcard .kt{font-size:14px}
.kcard.late{border-left-color:var(--bad);background:var(--bad-soft)}
.kcard.late .kt{color:var(--bad)}
.kmove.main button.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.kmove.main button{color:var(--ink)}
.ot td.ed{cursor:pointer}
.ot td.ed:hover{background:var(--pri-soft)}
.ot td .ce{width:100%;min-width:110px;font:inherit;padding:4px 6px;border:1px solid var(--pri);border-radius:6px;background:var(--card);color:var(--ink)}
.kmove{display:flex;gap:6px;margin-top:8px}
.kmove button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px;font-size:12px;cursor:pointer;color:var(--mute)}
.mic{border:0;border-radius:50%;width:44px;height:44px;background:var(--pri-soft);color:var(--pri);font-size:20px;cursor:pointer;flex:none}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.kb-text{white-space:pre-wrap;line-height:1.5;font-size:15px}
mark{background:#fff3b0;border-radius:3px;padding:0 1px}
.lesson{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lesson .ok{color:var(--ok);font-weight:700;width:18px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div id="ld" class="load hidden"></div>

<div id="login" class="hidden">
  <div class="card">
    <div class="logo">DD</div>
    <h2 style="margin:12px 0 0">Dent Dealer</h2>
    <div class="note">Введите личный код сотрудника</div>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="3" placeholder="•••">
    <button class="btn" style="width:100%" onclick="doLogin()">Войти</button>
    <div id="lerr" class="note" style="color:var(--bad)"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <div><div class="brand">Dent Dealer</div><div class="who" id="who"></div></div>
      <div class="sp"></div>
      <div class="month"><button onclick="shiftMonth(-1)">‹</button><span id="mon"></span><button onclick="shiftMonth(1)">›</button></div>
      <select id="mgr" class="hidden" style="width:auto;min-width:130px" onchange="S.mgr=this.value;render()"></select>
      <button class="btn ghost sm" onclick="doLogout()">Выйти</button>
    </div>
  </header>
  <div class="wrap" id="view"></div>
  <nav id="nav"></nav>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
// Экран берёт все данные месяца одним запросом (bundle) и хранит их в памяти и в телефоне:
// разделы переключаются без ожидания, сохранение идёт в фоне.
var URLKEY = /*KEY*/''; // ключ из личной ссылки ?k=… (подставляет сервер)
var GAS = !!(window.google && google.script && google.script.run); // открыта из Google; иначе — страница на GitHub, запросы идут на API_URL
if (!URLKEY && !GAS) { try { URLKEY = (new URLSearchParams(location.search).get('k') || '').replace(/[^\w-]/g, ''); } catch(e){} }
var S = { token: '', me: null, team: [], price: [], rate: 105, today: '', month: '', mgr: '', tab: 'orders', data: null, cache: {} };
var MON = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var STATUSES = ['Создан','Собран','Доставлен']; // новый заказ — без статуса; статус ставят бухгалтер и склад
function stCls(st){ return st==='Доставлен'?'ok':st==='Собран'?'vio':st==='Создан'?'gray':'warn'; }
function stLbl(st){ return st || ''; } // пустой статус показываем пустым полем
function wh(){ return S.me.role==='Кладовщик' || S.me.role==='Курьер'; }
function canSt(){ return !!S.me.st; } // может менять статус заказа
function cashless(v){ return /безнал|б\/н|^бн$/i.test(String(v||'')); }
function courier(){ return S.me.role==='Курьер'; }
// бухгалтер, склад и курьер видят заказы таблицей, как в рабочем файле (на узком экране — карточками)
function tableMode(){ return (S.me.acc || wh() || S.me.role==='Офис-менеджер') && innerWidth >= 760; }
window.addEventListener('resize', function(){ if (S.me && S.tab==='orders' && tableMode()!==S.lastTable) drawOrders(); });
var PM = [['calls','Звонки с новыми лидами'],['warm','Встречи с тёплыми клиентами'],['cold','Встречи с холодными клиентами'],['deals','Заключённые договоры'],['sum','Сумма заказов']];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Копейки показываем, если они есть: 16 547,4 → «16 547,40 ₽».
function money(n){ var v = Math.round((+n||0)*100)/100; return v.toLocaleString('ru-RU',{minimumFractionDigits: v%1 ? 2 : 0, maximumFractionDigits:2}) + ' ₽'; }
function pct(n){ return Math.round((+n||0)*1000)/10 + '%'; }
function localToday(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dmy(s){ return s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4) : ''; }
function num(v){ var n=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
var loading = 0;
function busy(d){ loading += d; $('ld').classList.toggle('hidden', loading <= 0); }
function toast(msg, err){ var t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, err?4500:1800); }

// Вызов функции сервера: из Google — google.script.run, со страницы GitHub — запрос POST {fn, args}.
function run(fn, args){
  if (GAS) return new Promise(function(res, rej){ var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn].apply(r, args); });
  return fetch(API_URL, {method:'POST', body: JSON.stringify({fn:fn, args:args})})
    .catch(function(){ throw new Error('Нет связи с сервером'); })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j.err) throw new Error(j.err); return j.res; });
}
function api(fn){
  var args = Array.prototype.slice.call(arguments,1);
  busy(1);
  return run(fn, fn === 'login' ? [args[0]] : [S.token].concat(args)).then(function(x){ busy(-1); return x; }, function(e){
    busy(-1);
    var m = String(e && e.message || e).replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'');
    if (m.indexOf('AUTH') >= 0){ store('dd_tok', null); showLogin(); throw new Error('Войдите заново'); }
    toast(m, true); throw new Error(m);
  });
}
// Сохранение в фоне: экран уже обновлён, при ошибке — сообщение и свежие данные с сервера.
function bg(fn){
  var args = Array.prototype.slice.call(arguments);
  return api.apply(null, args).then(function(x){ refresh(); return x; }).catch(function(){ refresh(); });
}

// ---------- данные ----------
function key(){ return 'dd_data_' + (S.me ? S.me.name : '') + '_' + S.month; }
var CFIELDS = ['addr','phone','comment','mgr','legal','clinic','region','email','lpr','buys','every','reg','alias'];
function norm(d){
  (d.clients||[]).forEach(function(c){ CFIELDS.forEach(function(k){ if (c[k]==null) c[k]=''; }); c.trade=!!c.trade; c.m=c.m||{}; });
  return d;
}
function setData(d){
  norm(d);
  S.cache[d.month] = d;
  if (d.month === S.month){ S.data = d; try { store(key(), JSON.stringify(d)); } catch(e){} }
}
// Свежие данные текущего месяца с сервера, без «Загрузка…» на экране.
var reqNo = 0;
function refresh(){
  var month = S.month, no = ++reqNo;
  return api('bundle', month).then(function(d){
    norm(d);
    var same = S.cache[month] && JSON.stringify(S.cache[month]) === JSON.stringify(d);
    setData(d);
    // не перерисовываем, если ничего не изменилось, открыта форма или человек печатает
    var a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id !== 'q' && $('view').contains(a);
    if (no === reqNo && month === S.month && !same && $('modal').classList.contains('hidden') && !typing) render();
  }).catch(function(){});
}
function useMonth(){
  S.data = S.cache[S.month] || null;
  if (!S.data){ try { var j = store(key()); if (j) S.data = S.cache[S.month] = JSON.parse(j); } catch(e){} }
  render();
  refresh();
}

// ---------- вход ----------
function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); closeModal(); setTimeout(function(){ $('code').focus(); }, 50); }
// Telegram: подключение своего аккаунта к боту программы.
function showTg(){
  var tg = S.tg || {};
  if (!tg.bot){

var CELLS = {mgr:'select', addr:'area', order:'area', disc:'num', sum:'num', trade:'bool', inv:'text', cash:'cash', date:'date', ship:'date', deliv:'date'};

  if (type === 'select' || type === 'cash'){
    el = document.createElement('select');
    var opts = type === 'select' ? (S.sales.indexOf(o.mgr)>=0 ? S.sales : [o.mgr].concat(S.sales)) : ['', 'Нал', 'Безнал'].concat(cur && cur!=='Нал' && cur!=='Безнал' ? [cur] : []);
    opts.forEach(function(v){ var op = document.createElement('option'); op.value = v; op.textContent = v || '—'; op.selected = v===cur; el.appendChild(op); });
  } else if (type === 'area'){ el = document.createElement('textarea'); el.rows = 3; el.value = cur; }
  else { el = document.createElement('input'); el.type = type === 'date' ? 'date' : 'text'; el.value = cur; if (type === 'num') el.inputMode = 'decimal'; }
  el.className = 'ce';
  var done = false;
  var finish = function(save){
    if (done) return; done = true;
    var v = el.value; drawOrders();
    if (!save) return;
    var patch = {};
    if (f === 'disc') patch.disc = num(v)/100; else if (f === 'sum') patch.sum = num(v); else patch[f] = v;
    if (patch[f] === o[f]) return;
    patchOrder(o, patch);
  };
  el.onblur = function(){ finish(true); };
  el.onkeydown = function(e){ if (e.key === 'Escape') finish(false); else if (e.key === 'Enter' && el.tagName !== 'TEXTAREA'){ e.preventDefault(); finish(true); } };
  if (el.tagName === 'SELECT') el.onchange = function(){ finish(true); };
  el.onclick = function(e){ e.stopPropagation(); };
  td.innerHTML = ''; td.appendChild(el); el.focus(); if (el.select && el.type !== 'date') el.select();
}
// Записать изменённые поля заказа: экран обновляется сразу, таблица — в фоне (как при сохранении формы).

// Телефоны из текста: «Руслан +7 925 530-32-37» → [{label, num}]
function phonesOf(text){
  var out = [], seen = {};
  String(text||'').split(/\n|;/).forEach(function(line){
    (line.match(/(?:\+7|8|7)[\s\-(]*\d{3}[\s\-)]*\d{3}[\s\-]*\d{2}[\s\-]*\d{2}/g) || []).forEach(function(p){
      var d = p.replace(/\D/g,''); if (d.length===11 && d[0]==='8') d = '7'+d.slice(1);
      if (seen[d]) return; seen[d] = 1;
      var label = line.replace(p,'').replace(/[:,\-–]+\s*$/,'').replace(/(тел\.?|телефон|контакт)\s*/i,'').trim().slice(0,30);
      out.push({label: label, num: '+'+d, show: p.trim()});
    });
  });
  return out;
}
function callButtons(text){
  return phonesOf(text).slice(0,6).map(function(p){ return '<a class="btn sec" style="text-decoration:none;text-align:center" href="tel:'+p.num+'">📞 '+esc(p.label||p.show)+'</a>'; }).join('');
}

function addrLine(addr){ return String(addr||'').split('\n')[0].replace(/(\+7|8)[\d\s\-()]{9,}/g,'').trim(); }

function routeButton(addr){
  var first = addrLine(addr);

  return '<a class="btn sec" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="'+mapsUrl([first])+'">🗺 Маршрут</a>';
}

    // сначала на сегодня и просроченные, потом без даты, потом будущие
    var kf = function(o){ return (o.deliv ? (o.deliv <= S.today ? '0'+o.deliv : '2'+o.deliv) : '1') + o.client; };
    list.sort(function(a,b){ return kf(a) < kf(b) ? -1 : kf(a) > kf(b) ? 1 : 0; });

    var m = part.trim().match(/^(.+?)\s*-\s*(\d+(?:[.,]\d+)?)\s*(уп|шт)\.?$/i), art = m && m[1].trim().toLowerCase();
    var p = m && S.price.filter(function(x){ return x.art.toLowerCase()===art; })[0];
    if (p) F.lines.push({art:p.art, name:p.name, eur:p.eur, eurPack:p.eurPack, rub:p.rub, perPack:p.perPack, unit:m[3].toLowerCase()==='уп'?'уп':'шт', qty:num(m[2])});
    else if (part.trim()) rest.push(part.trim());
  });
  F.extra = rest.join(', ');
}
function linesTotal(){ return F.lines.reduce(function(s,l){ return s + unitPrice(l, l.unit)*l.qty; }, 0); }
// адрес из последнего заказа клиента, если в карточке пусто
function lastAddr(name){
  var k = String(name||'').toLowerCase(), o = (S.data.orders||[]).filter(function(x){ return x.client.toLowerCase()===k && x.addr; })[0];
  return o ? o.addr : '';
}
function showTotal(){ if ($('f_total')) $('f_total').textContent = money(num($('f_sum').value) + num($('f_dlv').value)); if ($('f_rate')) $('f_rate').textContent = rate(); }
// Цена строки за единицу: товары с ценой в рублях — без курса €, остальные — по курсу.
function unitPrice(p, unit){ return p.rub ? p.rub*(unit==='уп'?(p.perPack||1):1) : (unit==='уп'?p.eurPack:p.eur)*rate(); }
var LAT = {'а':'a','в':'b','е':'e','к':'k','м':'m','н':'h','о':'o','р':'p','с':'c','т':'t','у':'y','х':'x'};
function simple(t){ return String(t||'').toLowerCase().replace(/ё/g,'е').replace(/[авекмнорстух]/g, function(ch){ return LAT[ch]; }).replace(/,/g,'.').replace(/×/g,'x'); }
// Поиск по любому слову: артикул, название, группа, материал, аналог, размер, гранулы, цена. Все слова запроса должны найтись.
function priceHay(p){
  if (p._h) return p._h;
  var pc = Math.round(unitPrice(p,'шт')), pk = Math.round(unitPrice(p,'уп'));
  var h = simple([p.art, p.name, p.group, p.mat, p.analog, pc, pk, p.rub?'':p.eur+' €'].join(' '));
  return p._h = h + ' ' + h.replace(/\s+/g,'');
}
function suggest(){
  var q = simple($('f_find').value.trim());
  if (q.length<1){ $('f_sug').innerHTML=''; return; }
  var words = q.split(/\s+/).filter(Boolean);
  var res = S.price.filter(function(p){ if (!(p.eur || p.eurPack || p.rub)) return false; var h = priceHay(p); return words.every(function(w){ return h.indexOf(w)>=0; }); }).slice(0,15);
  $('f_sug').innerHTML = res.length ? '<div class="sug">'+res.map(function(p){
    return '<div onclick="addLine(\''+esc(p.art)+'\')"><b>'+esc(p.art)+'</b> — '+esc(p.name)+'<br><small>'+
      (p.rub && (p.perPack||1)===1 ? 'шт: '+money(p.rub) : 'уп '+p.perPack+' шт: '+money(unitPrice(p,'уп'))+' · шт: '+money(unitPrice(p,'шт')))+(p.group?' · '+esc(p.group):'')+'</small></div>';
  }).join('')+'</div>' : '<div class="note">В прайсе не найдено. Попробуйте другое слово: часть названия, размер, гранулы или цену.</div>';
}
function addLine(art){
  var p = S.price.filter(function(x){ return x.art===art; })[0];
  F.lines.push({art:p.art, name:p.name, eur:p.eur, eurPack:p.eurPack, rub:p.rub, perPack:p.perPack, unit:p.rub&&(p.perPack||1)===1?'шт':'уп', qty:1});
  $('f_find').value=''; $('f_sug').innerHTML=''; drawLines();
}
function drawLines(){
  $('f_lines').innerHTML = F.lines.map(function(l,i){
    var pr = unitPrice(l, l.unit), one = l.rub && (l.perPack||1)===1;
    return '<div class="line"><div class="nm"><b>'+esc(l.art)+'</b> '+money(pr*l.qty)+'<small>'+esc(l.name)+'</small></div>'+
      '<input inputmode="numeric" value="'+l.qty+'" oninput="F.lines['+i+'].qty=+this.value||0;recalc(true)">'+
      (one?'<select disabled><option>шт</option></select>':'<select onchange="F.lines['+i+'].unit=this.value;drawLines()"><option'+(l.unit==='уп'?' selected':'')+'>уп</option><option'+(l.unit==='шт'?' selected':'')+'>шт</option></select>')+
      '<button onclick="F.lines.splice('+i+',1);drawLines()">×</button></div>';

// Сумма пересчитывается, только когда в заказе есть товары из прайса (иначе — как ввели руками).
function recalc(keepLines){
  if (keepLines===true){
    var nodes=document.querySelectorAll('#f_lines .nm b');
    F.lines.forEach(function(l,i){ var el=nodes[i]; if(el && el.nextSibling) el.nextSibling.textContent=' '+money(unitPrice(l, l.unit)*l.qty); });
  }
  if (!$('f_sum')) return;
  if (F.lines.length || F.base0){
    // товары из прайса считаются по ценам и скидке; то, что осталось в заказе текстом (без цены), — по прежней сумме
    var d = 1-num($('f_disc').value)/100;
    var rest = F.row ? Math.max(0, ((F.sum||0)-(F.dlv||0)) - (F.base0||0)*(1-(F.disc||0))) : 0;
    $('f_sum').value = Math.round((linesTotal()*d + rest)*100)/100;

var TSTAT = ['Новая','В работе','Готово'], PRIOS = ['Высокий','Обычный','Низкий'];
function prioCls(p){ return p==='Высокий'?'p-high':p==='Низкий'?'p-low':''; }
// Сначала самые срочные по сроку (просроченные, сегодня с временем по порядку…), без срока — в конце; при одном сроке — выше приоритет.
function byDue(a, b){
  var da = (a.due||'9999') + ' ' + (a.time||'99:99'), db = (b.due||'9999') + ' ' + (b.time||'99:99');
  if (da !== db) return da < db ? -1 : 1;
  return PRIOS.indexOf(a.prio||'Обычный') - PRIOS.indexOf(b.prio||'Обычный');
}

  }).join('');
  v.innerHTML = '<div class="bar"><button class="btn" style="flex:1" onclick="editTask()">+ Задача</button></div>'+
    (!own ? '' : '<div class="seg"><button class="'+(tf==='mine'?'on':'')+'" onclick="S.tf=\'mine\';render()">Мои задачи</button>'+
      (helps?'<button class="'+(tf==='helps'?'on':'')+'" onclick="S.tf=\'helps\';render()">Задачи · '+esc(fio(helps))+'</button>':'')+
      '<button class="'+(tf==='byme'?'on':'')+'" onclick="S.tf=\'byme\';render()">Я поставил коллегам</button></div>')+
    '<div class="kanban">'+cols+'</div><div class="note">На компьютере карточку можно перетащить мышкой, на телефоне — кнопками ← →.</div>';
}

// Перенос задачи: «завтра 10:00», «послезавтра», «пн 9:00», «05.11 14:30», «через 3 дня».
var WD = ['вс','пн','вт','ср','чт','пт','сб'], WDF = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function parseWhen(text){
  var low = String(text||'').toLowerCase().trim(), d = new Date(S.today+'T00:00:00'), add = null, m;
  if (/послезавтра/.test(low)) add = 2; else if (/завтра/.test(low)) add = 1; else if (/сегодня/.test(low)) add = 0;
  else if ((m = low.match(/через\s+(\d+)\s*(дн|день|дня|нед)/))) add = +m[1] * (/нед/.test(m[2]) ? 7 : 1);
  else if (/через\s+неделю/.test(low)) add = 7;
  else if ((m = low.match(/(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?/))){ var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : d.getFullYear(); d = new Date(y, +m[2]-1, +m[1]); if (!m[3] && d < new Date(S.today+'T00:00:00')) d.setFullYear(d.getFullYear()+1); add = 0; }
  else if ((m = low.match(/(\d{4})-(\d{2})-(\d{2})/))){ d = new Date(+m[1], +m[2]-1, +m[3]); add = 0; }
  else { for (var i = 0; i < 7; i++){ if (new RegExp('(^|\\s)('+WD[i]+'|'+WDF[i].slice(0,4)+'[а-я]*)(?=[\\s,.]|$)').test(low)){ add = ((i - d.getDay()) + 7) % 7 || 7; break; } } }
  var tm = low.match(/(\d{1,2}):(\d{2})/), time = tm ? String(+tm[1]).padStart(2,'0')+':'+tm[2] : '';
  if (!tm){ var th = low.match(/(^|\s)(?:в|к|на)\s+(\d{1,2})(?=[\s,.]|$)/); if (th && +th[2] < 24) time = String(+th[2]).padStart(2,'0')+':00'; }
  if (add === null && !time) return null;
  if (add === null) add = time > hmNow() ? 0 : 1;
  d.setDate(d.getDate()+add);
  return { due: isoOf(d), time: time };
}

// Срок словами: «сегодня», «завтра», иначе дд.мм.
function dueLbl(d){

  return d===S.today ? 'сегодня' : d===tm ? 'завтра' : dmy(d).slice(0,5);
}

// Распознавание речи браузера. Если программа открыта во встроенном окне, где микрофон запрещён,
// подсказываем микрофон на клавиатуре телефона — он работает в любом поле.
var REC = null;
function voiceHelp(){
  openModal('<h2><span>Голосовой ввод</span><button class="x" onclick="closeModal()">×</button></h2>'+
    '<div style="line-height:1.5">Google открывает программу во встроенном окне и не даёт ей микрофон. Надиктовать текст можно так:<br><br>'+
    '1. Нажмите в поле «Что сделать».<br>2. На клавиатуре телефона нажмите значок микрофона 🎤 (на iPhone — справа внизу, на Android — сверху клавиатуры).<br>3. Говорите — текст появится в поле.</div>'+
    '<div class="acts"><button class="btn" onclick="closeModal()">Понятно</button></div>');
}
function listen(onText, btn){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ voiceHelp(); return false; }
  if (REC){ REC.stop(); return true; }
  var r = new SR(); REC = r;
  r.lang = 'ru-RU'; r.interimResults = false; r.maxAlternatives = 1;
  if (btn) btn.classList.add('rec');
  r.onresult = function(e){ onText(e.results[0][0].transcript); };
  r.onerror = function(e){
    if (e.error==='not-allowed' || e.error==='service-not-allowed' || e.error==='audio-capture') voiceHelp(); else toast('Не расслышал, попробуйте ещё раз', true);
  };
  r.onend = function(){ REC = null; if (btn) btn.classList.remove('rec'); };
  try { r.start(); toast('Говорите…'); } catch(e){ REC = null; if (btn) btn.classList.remove('rec'); voiceHelp(); }
  return true;
}
function voiceInto(id){
  var el = $(id);
  listen(function(txt){ el.value = (el.value ? el.value.trim()+' ' : '') + txt; }, event && event.currentTarget);
}
// Сказали задачу целиком — разбираем срок, срочность и исполнителя, открываем готовую форму.
function voiceTask(){
  listen(function(txt){ editTask(null, parseTask(txt)); }, event && event.currentTarget);
}
function parseTask(txt){
  var t = {text: txt, due:'', emp: (S.me.boss?cur():'')||S.me.name, status:'Новая', prio:'Обычный'}, low = txt.toLowerCase();
  if (/срочн|важн|горит|немедленно/.test(low)) t.prio = 'Высокий';
  var d = new Date(S.today+'T00:00:00'), add = null;
  if (/послезавтра/.test(low)) add = 2; else if (/завтра/.test(low)) add = 1; else if (/сегодня/.test(low)) add = 0;
  var days = ['воскресень','понедельник','вторник','сред','четверг','пятниц','суббот'];
  days.forEach(function(w, wd){ if (add===null && new RegExp('(в|во|до|к)\\s+'+w).test(low)) add = ((wd - d.getDay() + 7) % 7) || 7; });
  var m = low.match(/(\d{1,2})[.\s](\d{1,2}|января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/);
  var MN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  if (m){ var mo = isNaN(+m[2]) ? MN.indexOf(m[2]) : +m[2]-1; if (mo>=0 && mo<12){ var dd = new Date(d.getFullYear(), mo, +m[1]); if (dd < d) dd.setFullYear(dd.getFullYear()+1); t.due = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'); } }
  if (add!==null && !t.due){ d.setDate(d.getDate()+add); t.due = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  var tm = low.match(/(\d{1,2}):(\d{2})/);
  if (tm && +tm[1] < 24 && +tm[2] < 60){ t.time = ('0'+tm[1]).slice(-2)+':'+tm[2]; if (!t.due) t.due = S.today; }
  if (S.me.boss) S.team.forEach(function(n){ if (low.indexOf(n.toLowerCase().slice(0, Math.max(4, n.length-2)))>=0) t.emp = n; });
  t.text = txt.charAt(0).toUpperCase() + txt.slice(1);
  return t;
}

// ---------- клиенты ----------
var CQ = '';
// Интервал закупок из текста («1-1,5 месяца», «6-8 месяцев», «пол года») → дней (по верхней границе).
function ivDays(t){
  t = String(t||'').toLowerCase().replace(/ё/g,'е'); if (!t) return 0;
  var half = /пол\s*года|полгода/.test(t), rest = t.replace(/пол\s*года|полгода/g,'');
  var n = (rest.match(/\d+(?:[.,]\d+)?/g)||[]).map(function(x){ return parseFloat(x.replace(',','.')); });
  if (!n.length) return /год/.test(rest) ? 365 : half ? 183 : /недел/.test(rest) ? 7 : /месяц/.test(rest) ? 30 : 0;
  var unit = /нед/.test(rest) ? 7 : /(^|[^а-я])д(е)?н/.test(rest) ? 1 : /год|лет/.test(rest) && !/мес/.test(rest) ? 365 : 30;
  return Math.round(Math.max.apply(null, n)*unit);
}
function yearSum(c){ var s=0; for (var k in (c.m||{})) s += c.m[k]; return s; }
// Через сколько дней клиент обычно заказывает: интервал из карточки, иначе ритм, который программа нашла по датам заказов.
function cycle(c){ var d = ivDays(c.every); return d ? {d:d, auto:false} : c.iv ? {d:c.iv, auto:true} : null; }
function addDays(iso, n){ var t = new Date(iso+'T00:00:00'); t.setDate(t.getDate()+n); return isoOf(t); }
// Когда ждать следующий заказ (по последнему заказу и обычному промежутку).
function nextOrder(c){ var cy = cycle(c); return cy && c.last ? addDays(c.last, cy.d) : ''; }
// «Пора звонить»: следующий заказ уже должен был быть (у найденного ритма — с запасом в несколько дней).
function dueCall(c){
  var cy = cycle(c); if (!cy || !c.last) return false;
  return addDays(c.last, cy.d + (cy.auto ? Math.max(3, Math.round(cy.d*0.15)) : 0)) < S.today;
}
// «Скоро закажет»: до ожидаемого заказа 7 дней или меньше — хорошее время напомнить о себе.
function soonCall(c){ var n = nextOrder(c); return n && !dueCall(c) && n <= addDays(S.today, 7); }
function daysLate(c){ var n = nextOrder(c); return n ? Math.round((Date.parse(S.today) - Date.parse(n))/864e5) : -9999; }
var CF = 'all', CS = 'last';
function vClients(){
  var v = $('view'), keep = document.activeElement && document.activeElement.id==='cq';
  var mine = S.me.boss ? cur() || null : (S.me.om || S.me.name), y = S.today.slice(0,4);
  var base = (S.data.clients||[]).filter(function(c){
    if (CQ) return [c.name,c.addr,c.phone,c.legal,c.clinic,c.lpr,c.alias,c.region,c.email].join(' ').toLowerCase().indexOf(CQ.toLowerCase())>=0;
    return !mine ? true : S.me.boss ? c.mgr===mine : (c.n>0 || c.mgr===mine);
  });
  if (CF==='none') CF = 'all';
  var due = base.filter(dueCall), soon = base.filter(soonCall);
  var list = (CF==='due' ? due : CF==='soon' ? soon : base).slice().sort(function(a,b){
    if (CF==='due' || CF==='soon') return daysLate(b) - daysLate(a);
    if (CS==='sum') return yearSum(b) - yearSum(a) || b.sum - a.sum;
    if (CS==='az') return a.name.localeCompare(b.name, 'ru');
    return (b.last||'') < (a.last||'') ? -1 : (b.last||'') > (a.last||'') ? 1 : b.n - a.n;
  });
  S.clist = list.slice(0, 200);
  var chip = function(k, t){ return '<button class="'+(CF===k?'on':'')+'" onclick="CF=\''+k+'\';render()">'+t+'</button>'; };
  v.innerHTML = '<div class="bar"><input id="cq" placeholder="Поиск: название, юр. название, ЛПР, телефон" value="'+esc(CQ)+'"><button class="btn" onclick="editClient()">+ Клиент</button></div>'+

// Подсказка по ритму: как часто заказывает и когда ждать следующий заказ.
function rhythmText(c){
  var cy = cycle(c), n = nextOrder(c), h = '';
  if (c.iv) h += '📈 обычно раз в '+c.iv+' дн. (по '+(c.ivn+1)+' заказам)';
  if (c.iv && c.every && Math.abs(ivDays(c.every)-c.iv) > Math.max(7, c.iv*0.3)) h += '<br><small>по заказам чаще/реже, чем в карточке — можно поправить «Интервал закупок»</small>';
  if (n) h += (h?'<br>':'')+(dueCall(c)?'<span class="tag warn">🔔 пора звонить</span> следующий заказ ждали '+dmy(n):soonCall(c)?'<span class="tag">⏳ скоро</span> следующий заказ ожидается ~'+dmy(n):'следующий заказ ожидается ~'+dmy(n));
  return h || (cy ? '' : '');
}

var KQ = '';

function hl(t){ var e = esc(t); if (!KQ) return e; var q = esc(KQ).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return e.replace(new RegExp(q,'gi'), function(m){ return '<mark>'+m+'</mark>'; }); }
function snippet(t){ var i = t.toLowerCase().indexOf(KQ.toLowerCase()); if (i < 0) return esc(t.slice(0,160)); var a = Math.max(0, i-70); return (a?'…':'')+hl(t.slice(a, i+KQ.length+110))+'…'; }
// База знаний по папкам (вкладки): регламенты менеджера, по продукту, другие, рабочие материалы — руководитель добавляет папки
// и переносит документы между ними. Поиск ищет по всем папкам сразу. Файлы лежат в папке на Диске, в документе — ссылка.
function kbFolders(){ return (S.kb && S.kb.folders) || []; }
function kbIcon(d){ var l = (d.link||'').toLowerCase(); return d.lesson ? '🎓' : /\.pdf|drive\.google|docs\.google/.test(l) ? '📎' : d.link ? '🔗' : '📄'; }
function vKb(){
  var v = $('view'), keep = document.activeElement && document.activeElement.id==='kq';

    v.innerHTML = '<div class="empty">Загрузка регламентов…</div>';

    return;
  }
  var folders = kbFolders();
  if (folders.indexOf(S.kbf) < 0) S.kbf = folders[0] || '';
  var list = S.kbAll.filter(function(d){
    if (!KQ) return d.section === S.kbf;
    var all = (d.title+' '+d.section+' '+d.text).toLowerCase(), q = KQ.toLowerCase();
    d.hits = all.split(q).length - 1;
    return d.hits > 0;
  }).sort(function(a,b){ return KQ ? b.hits - a.hits : a.lesson===b.lesson ? 0 : a.lesson ? 1 : -1; });
  S.kbl = list;
  var cnt = {}; S.kbAll.forEach(function(d){ cnt[d.section] = (cnt[d.section]||0)+1; });

    return '<div class="item" onclick="openKb('+i+')"><div class="t"><b>'+kbIcon(d)+' '+hl(d.title)+'</b>'+(KQ&&d.hits?'<span class="tag">совпадений: '+d.hits+'</span>':'')+'</div>'+

    (S.me.boss&&!KQ&&S.kbf?'<div class="note" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="flex:1">Папка «'+esc(S.kbf)+'»</span><button class="btn ghost sm" onclick="editFolder(S.kbf)">✎ Переименовать</button>'+(S.kb.drive?'<a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(S.kb.drive)+'">📁 Файлы на Диске</a>':'')+'</div>':'')+
    (list.length ? (KQ ? secs.map(function(s){ return '<div class="sec-t">'+esc(s)+'</div>'+list.filter(function(d){ return d.section===s; }).map(item).join(''); }).join('') : list.map(item).join(''))
      : '<div class="card empty">'+(KQ?'Ничего не найдено':'В этой папке пока пусто.'+(S.me.boss?'<br>Нажмите «+ Документ» или перенесите сюда документ из другой папки.':''))+'</div>');

function saveFolder(old){

  else f.push(name);
  S.kbf = name; closeModal(); render(); toast(old?'Папка переименована':'Папка добавлена');

}

// ---------- обучение: курсы, уроки, экзамены ----------
// Курсы и прогресс грузятся при первом открытии раздела; тексты уроков — по одному при открытии.
var LS = { lessons: {} };
function vLearn(){
  var v = $('view');

  }
  var who = S.me.boss ? (cur() || S.me.name) : S.me.name;

  var read = {}; log.forEach(function(x){ if (x.type==='Урок') read[x.id] = 1; });
  var h = S.me.boss ? '<div class="note" style="margin:8px 2px">Прогресс сотрудника: <b>'+esc(who)+'</b> (выберите вверху)</div>' : '';
  if (S.me.boss) h += reviewBlock();
  h += S.learn.courses.map(function(c, ci){
    var done = c.lessons.filter(function(l){ return read[l.id]; }).length, pc = c.lessons.length ? done/c.lessons.length : 0;
    return '<div class="card"><h3>🎓 '+esc(c.name)+'</h3><div class="prog" style="margin:4px 0 8px"><div class="h"><span>Пройдено уроков</span><b>'+done+' из '+c.lessons.length+'</b></div><div class="track"><i class="'+(pc>=1?'ok':'')+'" style="width:'+Math.round(pc*100)+'%"></i></div></div>'+
      c.lessons.map(function(l){ return '<div class="lesson" onclick="openLesson(\''+l.id+'\')"><span class="ok">'+(read[l.id]?'✓':'')+'</span><span style="flex:1">'+l.n+'. '+esc(l.title)+'</span><span style="color:var(--mute)">›</span></div>'; }).join('')+
      c.exams.map(function(e){
        var last = log.filter(function(x){ return x.type==='Экзамен' && x.id===e.id; }).pop();
        var st = last ? (last.grade==='Зачёт'?'<span class="tag ok">зачёт</span>':last.grade==='Незачёт'?'<span class="tag bad">незачёт</span>':'<span class="tag warn">на проверке</span>') : '';
        return '<div class="lesson" onclick="openExam(\''+e.id+'\')"><span class="ok">📝</span><span style="flex:1"><b>'+esc(e.name)+'</b> · вопросов '+e.count+'</span>'+st+'</div>'+
          (last && last.comment ? '<div class="note" style="margin:0 0 6px 28px">Комментарий: '+esc(last.comment)+'</div>' : '');
      }).join('')+'</div>';

function openLesson(id){
  var show = function(l){
    var read = S.learn.log.some(function(x){ return x.emp===S.me.name && x.type==='Урок' && x.id===id; });
    openModal('<h2><span>'+esc(l.title)+'</span><button class="x" onclick="closeModal()">×</button></h2>'+
      (l.link?'<a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px" href="'+esc(l.link)+'" target="_blank" rel="noopener">Открыть оригинал документа</a>':'')+

  };

function lessonRead(id){

// Экзамен: ответы пишутся в поля и сохраняются в телефоне как черновик, пока не отправлены.
function openExam(id){
  openModal('<div class="empty">Загрузка экзамена…</div>');
  api('getExam', id).then(function(qs){
    var draft = {}; try { draft = JSON.parse(store('dd_exam_'+id)||'{}'); } catch(e){}
    var name = '', count = qs.length;
    S.learn.courses.forEach(function(c){ c.exams.forEach(function(e){ if (e.id===id) name = e.name; }); });
    openModal('<h2><span>'+esc(name)+'</span><button class="x" onclick="closeModal()">×</button></h2>'+
      '<div class="note" style="margin-top:0">Вопросов: '+count+'. Ответы сохраняются на телефоне, можно продолжить позже. Проверяет руководитель.</div>'+
      qs.map(function(q){ return '<div class="qa"><b>'+q.n+'.</b> '+esc(q.q)+'<textarea data-n="'+q.n+'" style="margin-top:8px;min-height:60px" oninput="examDraft(\''+id+'\')">'+esc(draft[q.n]||'')+'</textarea></div>'; }).join('')+
      '<div class="acts"><button class="btn ghost" onclick="closeModal()">Продолжить позже</button><button class="btn" onclick="sendExam(\''+id+'\')">Отправить на проверку</button></div>');
  }).catch(function(){ closeModal(); });
}
function examDraft(id){
  var d = {}; Array.prototype.forEach.call(document.querySelectorAll('#sheet textarea[data-n]'), function(t){ d[t.dataset.n] = t.value; });
  store('dd_exam_'+id, JSON.stringify(d));
}
function sendExam(id){
  var ans = Array.prototype.map.call(document.querySelectorAll('#sheet textarea[data-n]'), function(t){ return {n:+t.dataset.n, a:t.value.trim()}; });
  var empty = ans.filter(function(a){ return !a.a; }).length;
  if (empty && !confirmBoxOnce(id, empty)) return;
  S.learn.log.push({emp:S.me.name, type:'Экзамен', id:id, grade:'На проверке', date:S.today});
  store('dd_exam_'+id, null);
  closeModal(); render(); toast('Экзамен отправлен на проверку');
  api('submitExam', id, ans).catch(function(){});
}
var EXAM_WARN = {};
function confirmBoxOnce(id, empty){
  if (EXAM_WARN[id]) return true;
  EXAM_WARN[id] = 1;
  toast('Без ответа вопросов: '+empty+'. Нажмите «Отправить» ещё раз, если всё равно отправить.', true);
  return false;
}
// Руководителю: экзамены на проверке — ответы рядом с эталоном, зачёт/незачёт.
function reviewBlock(){
  var wait = S.learn.log.filter(function(x){ return x.type==='Экзамен' && x.grade==='На проверке' && x.row; });
  if (!wait.length) return '';
  return '<div class="card"><h3>📝 Ждут проверки: '+wait.length+'</h3>'+wait.map(function(x){
    var name = x.id; S.learn.courses.forEach(function(c){ c.exams.forEach(function(e){ if (e.id===x.id) name = e.name; }); });
    return '<div class="lesson" onclick="reviewExam('+x.row+')"><span style="flex:1"><b>'+esc(x.emp)+'</b> · '+esc(name)+'</span><span class="tag gray">'+dmy(x.date)+'</span></div>';

function reviewExam(row){
  var x = S.learn.log.filter(function(l){ return l.row===row; })[0], ans = {};
  try { JSON.parse(x.answers||'[]').forEach(function(a){ ans[a.n] = a.a; }); } catch(e){}
  openModal('<div class="empty">Загрузка…</div>');
  api('getExam', x.id).then(function(qs){
    var ok = qs.filter(function(q){ return ans[q.n]; }).length;
    openModal('<h2><span>'+esc(x.emp)+' · проверка</span><button class="x" onclick="closeModal()">×</button></h2>'+
      '<div class="note" style="margin-top:0">Отвечено: '+ok+' из '+qs.length+'</div>'+
      qs.map(function(q){ return '<div class="qa"><b>'+q.n+'.</b> '+esc(q.q)+'<div style="margin-top:6px"><span class="tag">ответ</span> '+(ans[q.n]?esc(ans[q.n]):'<i style="color:var(--mute)">нет ответа</i>')+'</div>'+
        '<div class="note" style="margin-top:4px"><span class="tag ok">эталон</span> '+esc(q.a||'—')+'</div></div>'; }).join('')+
      '<label class="f">Комментарий стажёру<textarea id="g_comment"></textarea></label>'+

function setGrade(row, grade){
