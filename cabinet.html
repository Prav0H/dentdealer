<script>if (!window.supabase) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;
  --pri:#1A5CAB;--pri-soft:#e4eef9;--acc:#22C0E6;--ok:#2f9e6b;--ok-soft:#ddf3e8;--warn:#c07a12;--warn-soft:#fdf0d9;--bad:#c94141;--bad-soft:#fbe3e3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1A5CAB,#1f78c8);color:#fff;padding:10px 16px;box-shadow:0 2px 8px rgba(26,92,171,.25)}
.hrow{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:300;font-size:19px;letter-spacing:.4px}
.brand svg{height:28px;width:auto}
.who{font-size:13px;color:rgba(255,255,255,.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.cartbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:160px;border:0;background:none;padding:8px 4px 10px;font-size:12px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--pri);font-weight:600}
h2{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.note{color:var(--mute);font-size:13px;margin:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--pri-soft);color:var(--pri);border:0}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.gray{background:#eef0f3;color:var(--mute)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.money{font-weight:700;white-space:nowrap}
.old{color:var(--mute);text-decoration:line-through;font-size:12px;margin-right:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chips.brands button{font-weight:600;padding:7px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pic{height:120px;border-radius:10px;background:linear-gradient(135deg,#eef4fb,#e1f6fc);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pic svg{height:44px;opacity:.35}
.prod .nm{font-size:13px;color:var(--mute);min-height:36px}
.qrow{display:flex;gap:6px;align-items:center}
.qrow input{width:64px;text-align:center;padding:7px}
.qrow select{width:auto;padding:7px}
.qrow .btn{white-space:nowrap;flex:1}
.line{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.line:last-child{border-bottom:0}
.line .nm{flex:1;min-width:0}
.line input{width:64px;text-align:center;padding:6px}
.x{border:0;background:none;font-size:20px;color:var(--mute);cursor:pointer;padding:0 4px}
.total{display:flex;justify-content:space-between;background:var(--pri-soft);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:10px}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{max-width:380px;width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;max-width:90vw}
.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
/* ---------- оформление 2026-11-20: мягкие карточки, приветствие, цвет статуса ---------- */
html,body{background:linear-gradient(180deg,#eaf2fb 0,#f4f7fb 260px) no-repeat,var(--bg)}
header{background:linear-gradient(120deg,#164f94 0%,#1A5CAB 45%,#1f86d0 100%);padding:12px 16px 14px;border-radius:0 0 18px 18px;box-shadow:0 6px 20px rgba(26,92,171,.28)}
.brand{font-size:18px}
.who{font-size:14px;font-weight:600;color:#fff;opacity:.95}
.cartbtn{border:0;background:#fff;color:var(--pri);border-radius:999px;padding:7px 14px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px}
.cartbtn span{background:var(--pri);color:#fff;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
h2{font-size:17px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:'';width:4px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--acc),var(--pri))}
.card{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06)}
.card[onclick]{transition:transform .12s ease,box-shadow .12s ease}
.card[onclick]:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 10px 24px rgba(16,24,40,.09)}
.btn{background:linear-gradient(180deg,#2068b8,#1A5CAB);box-shadow:0 2px 6px rgba(26,92,171,.25);transition:filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--pri-soft);box-shadow:none}
.btn.ghost{background:none;box-shadow:none}
.money{color:#0f3d73}
.tag{font-weight:500}
nav{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-top:0;box-shadow:0 -4px 18px rgba(16,24,40,.07)}
nav button b{width:44px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s}
nav button.on b{background:var(--pri-soft)}
.hero{background:linear-gradient(135deg,#ffffff 0%,#f1f7fe 100%);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06)}
.hero .hi{font-size:13px;color:var(--mute)}
.hero .nm{font-size:19px;font-weight:700;margin:2px 0 10px;line-height:1.25}
.hero .kpi{display:flex;gap:8px;margin-bottom:12px}
.hero .kpi div{flex:1;min-width:0;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.hero .kpi b{display:block;font-size:17px;color:var(--pri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .kpi small{color:var(--mute);font-size:12px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .acts .btn{flex:1;min-width:140px}
.mgr{display:flex;gap:12px;align-items:center}
.ava{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pri));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.ocard{border-left:4px solid #cfd6df}
.ocard.s-new{border-left-color:var(--pri)}.ocard.s-pack{border-left-color:var(--acc)}.ocard.s-done{border-left-color:var(--ok)}
.ocard .t b{font-size:15px}
.ocard .money{font-size:16px}
.prod{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);padding:12px;transition:transform .12s ease}
.prod:hover{transform:translateY(-2px)}
.pic{height:130px;border-radius:12px}
.pic.b1{background:linear-gradient(135deg,#eef4fb,#dceefe)}.pic.b2{background:linear-gradient(135deg,#f3f0fb,#e6e0fa)}.pic.b3{background:linear-gradient(135deg,#eefaf4,#d9f3e7)}
.brandtag{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.prod .money{font-size:16px}
#q,#fq{border-radius:12px;padding:11px 12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.chips button{transition:background .12s,color .12s}
.total{border-radius:12px;font-size:16px}
.login .btn{width:100%}
@media(max-width:420px){.cartbtn .lbl{display:none}}
html,body{overflow-x:hidden;max-width:100%}
.hrow{min-width:0}.brand{flex:none}.who{flex:1;min-width:0}.sp{display:none}
.wrap{width:100%}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(220px,46%),1fr))}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.prod{padding:9px}.pic{height:96px}.qrow{flex-wrap:wrap}.qrow .btn{flex:1 1 100%}.brand{font-size:0;gap:0}.brand svg{height:26px}}
.t{min-width:0}.t b{min-width:0;overflow-wrap:anywhere}
.tags{min-width:0}.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}

.doc{white-space:pre-line}
a{color:var(--pri)}
</style>
</head>
<body>
<div id="boot" class="center"><div class="note">Загрузка…</div></div>
<div id="nolink" class="center hidden"><div class="card login">
  <div style="display:flex;justify-content:center"><svg viewBox="12 8 38 52" style="height:44px"><polygon fill="#1A5CAB" points="16.5,30 35.5,12 35.5,18.5 16.5,36.5"/><polygon fill="#22C0E6" points="26.5,32 45.5,14 45.5,20.5 26.5,38.5"/><polygon fill="#1A5CAB" points="16.5,49 35.5,31 35.5,37.5 16.5,55.5"/><polygon fill="#22C0E6" points="26.5,51 45.5,33 45.5,39.5 26.5,57.5"/></svg></div>
  <h2 style="margin-top:8px">Личный кабинет Dent Dealer</h2>
  <p class="note" id="nolink_t">Чтобы войти, откройте личную ссылку, которую прислал ваш менеджер. Если ссылки нет или она перестала работать — попросите у менеджера новую.</p>
</div></div>

<div id="app" class="hidden">
  <header><div class="hrow">
    <div class="brand"><svg aria-hidden="true" viewBox="12 8 38 52"><polygon fill="#ffffff" points="16.5,30 35.5,12 35.5,18.5 16.5,36.5"/><polygon fill="#7fdcf3" points="26.5,32 45.5,14 45.5,20.5 26.5,38.5"/><polygon fill="#ffffff" points="16.5,49 35.5,31 35.5,37.5 16.5,55.5"/><polygon fill="#7fdcf3" points="26.5,51 45.5,33 45.5,39.5 26.5,57.5"/></svg>Dent Dealer</div>
    <div class="who" id="who"></div><div class="sp"></div>
    <button class="cartbtn" onclick="go('cart')" title="Новый заказ">🛒<span class="lbl" style="background:none;color:inherit;padding:0;min-width:0">Корзина</span><span id="cartn">0</span></button>
  </div></header>
  <div class="wrap" id="view"></div>
  <nav id="nav"></nav>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
// Личный кабинет клиента. Вход — по личной ссылке (?t=ключ), её выдаёт менеджер.
// Все данные приходят одним запросом из базы и только по этому клиенту; цены — сразу в рублях, со скидкой клиента.
var SB = supabase.createClient('https://mtesawbuzibtnmoxevyl.supabase.co', 'sb_publishable_0nbf2ukbFwbkG7H241f8Fg_kx4jQKPy', {auth: {persistSession: false}});
var D = null, TAB = 'orders', Q = '', GRP = '', SHOW = 60, CART = [];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ var v = Math.round((+n||0)*100)/100; return v.toLocaleString('ru-RU', {minimumFractionDigits: v%1 ? 2 : 0, maximumFractionDigits: 2}) + ' ₽'; }
function dmy(s){ s = String(s||''); return s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4) : ''; }
function num(v){ var n = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n) ? 0 : n; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function toast(m, err){ var t = document.createElement('div'); t.className = 'toast'+(err?' err':''); t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, err ? 4500 : 2200); }
function openModal(h){ $('sheet').innerHTML = h; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }
var ICON = '<svg viewBox="12 8 38 52"><polygon fill="#1A5CAB" points="16.5,30 35.5,12 35.5,18.5 16.5,36.5"/><polygon fill="#22C0E6" points="26.5,32 45.5,14 45.5,20.5 26.5,38.5"/><polygon fill="#1A5CAB" points="16.5,49 35.5,31 35.5,37.5 16.5,55.5"/><polygon fill="#22C0E6" points="26.5,51 45.5,33 45.5,39.5 26.5,57.5"/></svg>';

// ключ: из ссылки (и запоминаем — чтобы с экрана «Домой» открывалось само), иначе — запомненный
var TOK = '';
try { TOK = (new URLSearchParams(location.search).get('t') || '').replace(/[^0-9a-f]/gi, ''); } catch(e){}
if (TOK) store('dd_cab', TOK); else TOK = store('dd_cab') || '';
try { CART = JSON.parse(store('dd_cart') || '[]') || []; } catch(e){ CART = []; }

function load(quiet){
  if (!TOK){ show('nolink'); return Promise.resolve(); }
  return SB.rpc('cab_data', {p_tok: TOK}).then(function(r){
    if (r.error){
      if (/LINK/.test(r.error.message)){ store('dd_cab', null); show('nolink'); $('nolink_t').textContent = 'Ссылка больше не действует. Попросите у менеджера новую — она откроет кабинет сразу.'; return; }
      throw r.error;
    }
    D = r.data; show('app'); render();
  }).catch(function(e){ if (!quiet){ show(D ? 'app' : 'nolink'); toast('Нет связи. Попробуйте обновить страницу.', true); } });
}
function show(id){ ['boot','nolink','app'].forEach(function(x){ $(x).classList.toggle('hidden', x !== id); }); }
document.addEventListener('visibilitychange', function(){ if (!document.hidden && D) load(true); });

var TABS = [['orders','📦','Заказы'], ['shop','🛍','Каталог'], ['promos','🏷','Акции'], ['kb','📚','Материалы']];
function go(t){ TAB = t; render(); window.scrollTo(0, 0); }
function render(){
  if (!D) return;
  $('who').textContent = D.client.name;
  $('cartn').textContent = CART.length;
  var tabs = TABS.filter(function(t){ return t[0] !== 'kb' || (D.kb||[]).length; });
  $('nav').innerHTML = tabs.map(function(t){ return '<button class="'+(TAB===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>'; }).join('');
  $('view').innerHTML = ({orders: vOrders, shop: vShop, cart: vCart, promos: vPromos, kb: vKb}[TAB] || vOrders)();
  if (TAB === 'shop'){ var q = $('q'); if (q){ q.value = Q; q.oninput = function(){ Q = q.value; SHOW = 60; drawGrid(); }; } drawGrid(); }
}

// ---------- заказы ----------
var STL = {'': 'Принят', 'Создан': 'Принят', 'Собран': 'Собран', 'Доставлен': 'Доставлен'};
function stTag(o){ var s = o.status || ''; return '<span class="tag '+(s==='Доставлен'?'ok':s==='Собран'?'':'gray')+'">'+STL[s]+'</span>'; }
function shipLines(o){
  var out = [];
  String(o.order||'').split(/,\s*/).forEach(function(part){
    part = part.trim(); if (!part) return;
    var m = part.match(/^(.+?)\s*-\s*(\d+(?:[.,]\d+)?)\s*(уп|шт)\.?/i);
    out.push(m ? {art: m[1].trim(), qty: num(m[2]), unit: m[3].toLowerCase()} : {art: part, qty: 1, unit: ''});
  });
  return out;
}
function shipInfo(o){
  var ships = (D.ships||[]).filter(function(s){ return (s.items||[]).some(function(it){ return it.k === o.k; }); }), done = {}, lines = shipLines(o);
  ships.forEach(function(s){ (s.items||[]).forEach(function(it){ if (it.k === o.k){ var a = String(it.art).toLowerCase()+'|'+(it.unit||''); done[a] = (done[a]||0) + num(it.qty); } }); });
  lines.forEach(function(l){ var a = l.art.toLowerCase()+'|'+l.unit, d = Math.min(l.qty, done[a]||0); l.done = d; done[a] = (done[a]||0) - d; l.left = Math.max(0, l.qty - d); });
  return { ships: ships, lines: lines, st: !ships.length ? '' : lines.every(function(l){ return !l.left; }) ? 'full' : 'part' };
}
var RQ = {new: ['warn', 'Ждёт подтверждения менеджера'], done: ['ok', 'Принято менеджером'], rejected: ['bad', 'Отклонено менеджером'], cancelled: ['gray', 'Отменена вами']};
function rqTitle(r){ var i = r.ref_info || {}; return r.kind === 'change' ? 'Изменение заказа от '+dmy(i.date) : r.kind === 'cancel' ? 'Отмена заказа от '+dmy(i.date) : 'Заявка №'+r.id; }
function oref(o){ return o.k + '#' + (o.inv||''); } // заказ = «дата|менеджер|клиент#счёт» (в один день у клиента бывает два заказа)
function pendingFor(o){ var k = oref(o); return (D.requests||[]).filter(function(r){ return r.ref === k; })[0] || null; } // последний запрос по заказу
var EDIT = null; // что отправляет форма: {id} — правка своей заявки; {ref, date} — изменение оформленного заказа
function rpcErr(r){ toast(/LINK/.test(r.error.message) ? 'Ссылка больше не действует — попросите у менеджера новую' : r.error.message, true); }
// заказ → позиции из прайса (для «Повторить»); что не нашлось в прайсе — пропускаем
function toCart(lines){
  var out = [], miss = [];
  lines.forEach(function(l){
    var p = (D.price||[]).filter(function(x){ return x.art.toLowerCase() === String(l.art).toLowerCase(); })[0];
    if (!p || !(l.qty > 0)){ miss.push(l.art); return; }
    out.push({art: p.art, unit: l.unit === 'уп' && p.pp > 1 ? 'уп' : 'шт', qty: l.qty});
  });
  return {items: out, miss: miss};
}
function repeatOrder(o){
  var r = o.items ? toCart(o.items) : toCart(shipLines(o));
  if (!r.items.length){ toast('В этом заказе нет товаров из каталога — соберите заказ заново', true); return; }
  CART = r.items; saveCart(); closeModal(); go('cart');

function sendOrder(){
  var items = CART.filter(function(c){ return c.qty > 0; });

  var cm = ($('cmt').value || '').trim(), ad = ($('faddr').value || '').trim();
  var call = EDIT && EDIT.id ? SB.rpc('cab_order_edit', {p_tok: TOK, p_id: EDIT.id, p_items: items, p_comment: cm, p_addr: ad})
    : EDIT && EDIT.ref ? SB.rpc('cab_order_change', {p_tok: TOK, p_ref: EDIT.ref, p_kind: 'change', p_items: items, p_comment: cm, p_addr: ad})
    : SB.rpc('cab_order_add', {p_tok: TOK, p_items: items, p_comment: cm, p_addr: ad});
  call.then(function(r){
    if (r.error){ $('send').disabled = false; rpcErr(r); return; }
    var msg = EDIT ? (EDIT.ref ? 'Изменения отправлены менеджеру' : 'Заявка изменена') : 'Заказ принят — менеджер подтвердит наличие и сроки';
    CART = []; FCMT = ''; FADDR = null; EDIT = null; saveCart(); toast(msg); TAB = 'orders'; load();

}

  return '<h2>Акции</h2>' + (ps.length ? ps.map(function(p){
    var all = /(^|[,;\s])\*($|[,;\s])/.test(p.arts||'');
    return '<div class="card"><b>🏷 '+esc(p.title)+'</b><div class="tags"><span class="tag warn">'+(p.kind==='price' ? 'цена '+money(p.val)+' за '+(p.unit||'шт') : 'скидка '+esc(p.val)+'%')+'</span>'+
      (p.from||p.to ? '<span class="tag gray">'+(p.from?'с '+dmy(p.from)+' ':'')+(p.to?'по '+dmy(p.to):'')+'</span>' : '')+'</div>'+
      '<div class="note">'+(all ? 'На все товары' : 'Товары: '+esc(p.arts))+'</div>'+(p.cond ? '<div class="note">Условия: '+esc(p.cond)+'</div>' : '')+
      (all ? '' : '<button class="btn sec sm" onclick="Q=this.dataset.a;GRP=\'\';go(\'shop\')" data-a="'+esc(String(p.arts||'').split(/[,;\n]/)[0].trim())+'">Смотреть в каталоге</button>')+'</div>';
  }).join('') : '<div class="card note">Сейчас акций нет. Загляните позже.</div>');
}
function vKb(){
  var by = {}; (D.kb||[]).forEach(function(d, i){ (by[d.section] = by[d.section] || []).push(i); });
  return '<h2>Материалы</h2>' + Object.keys(by).map(function(s){
    return '<div class="card"><b>📁 '+esc(s)+'</b>'+by[s].map(function(i){ var d = D.kb[i];
      return '<div class="line"><div class="nm">'+esc(d.title)+'</div><button class="btn sec sm" onclick="openDoc('+i+')">Открыть</button></div>'; }).join('')+'</div>';
  }).join('');
}
function openDoc(i){
  var d = D.kb[i];
  openModal('<h3><span>'+esc(d.title)+'</span><button class="x" onclick="closeModal()">×</button></h3>'+
    (d.link ? '<p><a target="_blank" rel="noopener" href="'+esc(d.link)+'">Открыть оригинал</a></p>' : '')+'<div class="card doc">'+esc(d.text||'')+'</div>');
}

if (TOK) load(); else show('nolink');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
